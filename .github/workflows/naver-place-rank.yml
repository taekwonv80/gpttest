name: Naver Place keyword rank

on:
  workflow_dispatch:
  schedule:
    # 00:15 UTC = 09:15 KST
    - cron: "15 0 * * *"

permissions:
  contents: write

concurrency:
  group: naver-place-keyword-rank
  cancel-in-progress: false

jobs:
  collect-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      NAVER_CUSTOMER_ID: ${{ secrets.NAVER_CUSTOMER_ID }}
      NAVER_ACCESS_LICENSE: ${{ secrets.NAVER_ACCESS_LICENSE }}
      NAVER_SECRET_KEY: ${{ secrets.NAVER_SECRET_KEY }}
      DASHBOARD_URL: https://taekwonv80.github.io/gpttest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install "playwright>=1.54,<2"
          python -m playwright install --with-deps chromium
      - name: Collect public Map result positions and notify Slack
        run: python scripts/naver_place_rank_collector.py
      - name: Commit rank history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rank_history.json
          if git diff --cached --quiet; then
            echo "No rank history changes."
            exit 0
          fi
          git commit -m "data: collect Naver Place keyword rank"
          git push
