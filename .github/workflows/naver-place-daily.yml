name: Naver SmartPlace daily statistics

on:
  workflow_dispatch:
    inputs:
      upload_diagnostics:
        description: "Upload rendered SmartPlace screens and text for parser diagnostics"
        type: boolean
        required: false
        default: false
  schedule:
    # 00:10 UTC = 09:10 KST. 전날 통계 반영 지연을 피하기 위해 오전에 실행합니다.
    - cron: "10 0 * * *"

permissions:
  contents: write

concurrency:
  group: naver-place-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NAVER_PLACE_STORAGE_STATE_B64: ${{ secrets.NAVER_PLACE_STORAGE_STATE_B64 }}
      NAVER_PLACE_REPORT_URL: ${{ secrets.NAVER_PLACE_REPORT_URL }}
      NAVER_PLACE_STATS_URL: ${{ secrets.NAVER_PLACE_STATS_URL }}
      NAVER_PLACE_SMARTCALL_STATS_URL: ${{ secrets.NAVER_PLACE_SMARTCALL_STATS_URL }}
      NAVER_PLACE_RESERVATION_STATS_URL: ${{ secrets.NAVER_PLACE_RESERVATION_STATS_URL }}
      NAVER_PLACE_REVIEW_STATS_URL: ${{ secrets.NAVER_PLACE_REVIEW_STATS_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install collector
        run: |
          pip install "playwright>=1.54,<2"
          python -m playwright install --with-deps chromium
      - name: Validate secrets
        shell: bash
        run: |
          for name in \
            NAVER_PLACE_STORAGE_STATE_B64 \
            NAVER_PLACE_REPORT_URL \
            NAVER_PLACE_STATS_URL \
            NAVER_PLACE_SMARTCALL_STATS_URL \
            NAVER_PLACE_RESERVATION_STATS_URL \
            NAVER_PLACE_REVIEW_STATS_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Required Actions secret is missing: ${name}"
              exit 1
            fi
          done
      - name: Collect SmartPlace statistics
        run: python scripts/naver_place_collector.py
      - name: Upload diagnostics when requested or on failure
        if: failure() || (github.event_name == 'workflow_dispatch' && inputs.upload_diagnostics)
        uses: actions/upload-artifact@v6
        with:
          name: naver-place-diagnostic
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 3
      - name: Commit accumulated statistics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/naver_place_daily.csv data/naver_place_latest.json
          if git diff --cached --quiet; then
            echo "No SmartPlace data changes to commit."
            exit 0
          fi
          git commit -m "data: collect SmartPlace daily statistics"
          git push
