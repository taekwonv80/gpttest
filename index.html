<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Python Streamlit과 Plotly로 만든 네이버 마케팅 대시보드">
  <title>Localight · Python 마케팅 대시보드</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.95.1/build/stlite.css">
  <style>
    html, body, #root { width: 100%; min-height: 100%; margin: 0; background: #f4f6f4; }
    .loading-note {
      position: fixed; z-index: 100; right: 18px; bottom: 18px;
      padding: 10px 14px; border: 1px solid #dce2de; border-radius: 999px;
      background: rgba(255,255,255,.92); color: #606762;
      box-shadow: 0 10px 30px rgba(22,28,24,.08);
      font: 700 11px/1.4 system-ui, sans-serif;
      animation: hide-note .3s ease 12s forwards;
    }
    .loading-note span { color: #03c75a; }
    @keyframes hide-note { to { opacity: 0; visibility: hidden; } }
  </style>
</head>
<body>
  <div class="loading-note"><span>●</span> Python 대시보드를 불러오는 중입니다</div>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.95.1/build/stlite.js";
    const appUrl = new URL("./streamlit_app.py", window.location.href).href;
    const appResponse = await fetch(appUrl);
    if (!appResponse.ok) throw new Error(`Python app load failed: ${appResponse.status}`);
    const appSource = await appResponse.text();

    const files = { "streamlit_app.py": appSource };
    for (const path of ["data/campaign_weekly.json", "data/connections.json"]) {
      const response = await fetch(new URL(`./${path}`, window.location.href), { cache: "no-store" });
      if (response.ok) files[path] = await response.text();
    }

    mount(
      {
        entrypoint: "streamlit_app.py",
        files,
        requirements: ["plotly"],
        streamlitConfig: {
          "client.toolbarMode": "viewer",
          "browser.gatherUsageStats": false,
          "theme.base": "light",
          "theme.primaryColor": "#03C75A",
          "theme.backgroundColor": "#F4F6F4",
          "theme.secondaryBackgroundColor": "#FFFFFF",
          "theme.textColor": "#121413",
        },
      },
      document.getElementById("root"),
    );
  </script>
</body>
</html>
